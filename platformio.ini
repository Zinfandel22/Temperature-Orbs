[platformio]
default_envs = TempOrbs
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include

[env:TempOrbs]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200

lib_deps =
    lvgl/lvgl @ 8.3.11
	blynkkk/Blynk@1.4.0
	blynk-technologies/BlynkEdgent@^0.9.0
	bblanchon/ArduinoJson@^7.4.3
	arduino-libraries/ArduinoHttpClient@^0.6.2
	h2zero/NimBLE-Arduino@^2.5.1
	mathertel/OneButton@^2.6.2
	adafruit/Adafruit NeoPixel@^1.15.5
	bodmer/TFT_eSPI@^2.5.43

build_flags =
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D USER_SETUP_LOADED=1
	-D PCB_VERSION="\"TempOrbs\""
	-D LV_CONF_SKIP
	-D LV_TICK_CUSTOM=1
	-D LV_MEM_CUSTOM=1
	-D LV_FONT_MONTSERRAT_28=1
	-D LV_FONT_MONTSERRAT_40=1
	-I firmware/config
	-include "firmware/config/config.system.h"